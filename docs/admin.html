<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anyway 管理画面</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0c0c10; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { font-size: 12px; opacity: 0.6; margin: 0 0 24px; }
  .login-box { max-width: 320px; margin: 60px auto; padding: 24px; border-radius: 16px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); }
  .login-box input { width: 100%; padding: 11px; margin-bottom: 10px; border-radius: 10px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #fff; font-size: 14px; }
  .login-box button { width: 100%; padding: 12px; border-radius: 10px; border: none; cursor: pointer;
    background: #fff; color: #0c0c10; font-weight: 700; font-size: 14px; }
  .error { color: #ff6b6b; font-size: 12px; margin: 8px 0 0; }
  .hidden { display: none !important; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 8px; }
  .toolbar select, .toolbar button { padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08); color: #fff; font-size: 13px; }
  .toolbar button { cursor: pointer; }
  .row { padding: 14px; border-radius: 12px; background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12); margin-bottom: 10px; }
  .row-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 8px; }
  .reason-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    background: rgba(78,168,255,0.25); color: #9ecfff; flex-shrink: 0; }
  .reason-badge.bug { background: rgba(255,107,107,0.25); color: #ffb3b3; }
  .row-time { font-size: 11px; opacity: 0.55; }
  .row-detail { font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .empty, .loading { text-align: center; padding: 40px 0; opacity: 0.6; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="login-view" class="login-box">
    <h1 style="text-align:center;">管理画面ログイン</h1>
    <p class="sub" style="text-align:center;">運営者アカウントでログインしてください</p>
    <input type="email" id="login-email" placeholder="メールアドレス">
    <input type="password" id="login-password" placeholder="パスワード">
    <button id="login-btn">ログイン</button>
    <p class="error hidden" id="login-error"></p>
  </div>

  <div id="admin-view" class="hidden">
    <h1>🐛 バグ・通報レポート</h1>
    <p class="sub">reports テーブルの内容を新しい順に表示しています(このページは運営者アカウントのみ閲覧できます)</p>
    <div class="toolbar">
      <select id="reason-filter">
        <option value="">すべて</option>
        <option value="bug_report">バグ報告のみ</option>
      </select>
      <button id="logout-btn">ログアウト</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  // Same public project as the main app (output/app.js) -- this is the publishable anon key,
  // safe to embed client-side. Access control here is NOT a Supabase RLS role check, it's a
  // simple allow-list on the logged-in user's email (see OWNER_EMAIL below), matching task71's
  // "MVP: only show this to the owner account" scope. If reports' RLS policy restricts SELECT to
  // the reporter's own rows, the owner account will only see reports it filed itself -- see the
  // honest note about this in status.json task71/84; a real fix needs a Supabase-side RLS policy
  // change (or a service-role-backed endpoint) that this static page has no access to make.
  const SUPABASE_URL = 'https://qmqmpfjgxgwmsdeqpbiu.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_wGQyRnhd3bxGmcppLkOx8w_-xJI3qn1';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const OWNER_EMAIL = 'hoanggia101218@gmail.com';

  const loginView = document.getElementById('login-view');
  const adminView = document.getElementById('admin-view');
  const loginError = document.getElementById('login-error');
  const list = document.getElementById('list');
  let allReports = [];

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function formatTime(iso) {
    try { return new Date(iso).toLocaleString('ja-JP'); } catch (e) { return iso || ''; }
  }

  function renderList() {
    const filter = document.getElementById('reason-filter').value;
    const rows = filter ? allReports.filter((r) => r.reason === filter) : allReports;
    if (!rows.length) { list.innerHTML = '<p class="empty">レポートはありません</p>'; return; }
    list.innerHTML = rows.map((r) => `
      <div class="row">
        <div class="row-top">
          <span class="reason-badge ${r.reason === 'bug_report' ? 'bug' : ''}">${escapeHtml(r.reason || '(不明)')}</span>
          <span class="row-time">${escapeHtml(formatTime(r.created_at))}</span>
        </div>
        <div class="row-detail">${escapeHtml(r.detail || '(詳細なし)')}</div>
      </div>
    `).join('');
  }

  async function loadReports() {
    list.innerHTML = '<p class="loading">読み込み中…</p>';
    const { data, error } = await sb.from('reports').select('*').order('created_at', { ascending: false }).limit(200);
    if (error) {
      list.innerHTML = `<p class="empty">読み込みに失敗しました: ${escapeHtml(error.message)}<br>(reportsテーブルのRLSが本人分の行しか読めない設定の場合、この運営者アカウント自身が出した通報しか見えません。全件見るにはSupabase側のRLSポリシー調整が必要です)</p>`;
      return;
    }
    allReports = data || [];
    renderList();
  }

  function showAdmin() {
    loginView.classList.add('hidden');
    adminView.classList.remove('hidden');
    loadReports();
  }
  function showLogin(message) {
    adminView.classList.add('hidden');
    loginView.classList.remove('hidden');
    if (message) { loginError.textContent = message; loginError.classList.remove('hidden'); }
  }

  document.getElementById('login-btn').addEventListener('click', async () => {
    loginError.classList.add('hidden');
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if (!email || !password) { loginError.textContent = 'メールアドレスとパスワードを入力してください'; loginError.classList.remove('hidden'); return; }
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { loginError.textContent = 'ログインに失敗しました: ' + error.message; loginError.classList.remove('hidden'); return; }
    if ((data.user && data.user.email) !== OWNER_EMAIL) {
      await sb.auth.signOut();
      loginError.textContent = 'このアカウントには管理画面の閲覧権限がありません';
      loginError.classList.remove('hidden');
      return;
    }
    showAdmin();
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await sb.auth.signOut();
    showLogin();
  });

  document.getElementById('reason-filter').addEventListener('change', renderList);

  // If already logged in as the owner (session persisted from a previous visit), skip straight
  // to the report list instead of asking to log in again.
  sb.auth.getSession().then(({ data }) => {
    const session = data && data.session;
    if (session && session.user && session.user.email === OWNER_EMAIL) showAdmin();
  });
})();
</script>
</body>
</html>
