<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>精霊ギャラリー - Element Awakening</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    transition: background 0.4s ease;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  #tabs {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; justify-content: center; gap: 6px; flex-wrap: wrap;
    padding: 10px 10px 8px; background: rgba(20, 20, 26, 0.55); backdrop-filter: blur(6px);
  }
  #tabs button {
    appearance: none; border: 1px solid rgba(255,255,255,0.25); border-radius: 999px;
    padding: 7px 16px; font-size: 13px; font-weight: 600; letter-spacing: 0.03em;
    background: rgba(255,255,255,0.08); color: #fff; cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  #tabs button:hover { background: rgba(255,255,255,0.2); }
  #tabs button.active { background: #fff; color: #14151a; transform: translateY(-1px); }

  #hud {
    position: fixed; top: 62px; left: 18px; z-index: 5;
    text-shadow: 0 1px 2px rgba(255,255,255,0.8);
    pointer-events: none; user-select: none;
  }
  #hud .name { font-size: 26px; font-weight: 700; letter-spacing: 0.05em; }
  #hud .badge {
    display: inline-block; margin-top: 4px; padding: 3px 10px; border-radius: 999px;
    color: #fff; font-size: 12px; font-weight: 600;
  }
  #hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 5;
    font-size: 13px; opacity: 0.75; pointer-events: none; user-select: none;
    text-shadow: 0 1px 2px rgba(255,255,255,0.8);
  }
  #status {
    position: fixed; bottom: 16px; right: 18px; z-index: 5; font-size: 12px;
    background: rgba(255,255,255,0.55); border-radius: 8px; padding: 6px 10px;
    font-family: monospace; pointer-events: none; user-select: none; text-align: right;
  }
</style>
</head>
<body>
<div id="tabs"></div>
<div id="app"></div>
<div id="hud">
  <div class="name" id="hudName"></div>
  <div class="badge" id="hudBadge"></div>
</div>
<div id="hint">ドラッグで回転 / ホイールでズーム(自動回転中)</div>
<div id="status">loading three.js…</div>

<!-- Classic (non-module) three.js r128 build on purpose: this file is opened directly via
     file:// (as an iframe inside index.html, and standalone), and file:// blocks
     type="module"/import script loading entirely (Chrome/Edge CORS restriction). -->
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script>

// 精霊ギャラリー: task 20(status.json)の閲覧用ビューア。
// 10体それぞれのビルド/アイドルアニメーション処理を、元ファイル
// (output_contrib/Toshiba・HP・DELL/element_poc/*.html, 3D素材/index.html)から
// このファイルへ移植したもの。元ファイルは一切変更・削除していない
// (コピー元として残したまま)。games.js本体への統合ではなく、あくまで
// 10体を1画面で切り替えて見られるギャラリー(task 17の統合方針とは別)。

const statusEl = document.getElementById("status");
const hudNameEl = document.getElementById("hudName");
const hudBadgeEl = document.getElementById("hudBadge");
const tabsEl = document.getElementById("tabs");
function setStatus(msg) { statusEl.textContent = msg; }

let renderer, scene, camera, controls, clock;
let animErrorCount = 0;
let current = null; // { update(t,dt), dispose() }
let currentKey = null;

// キャラクター定義。build関数(buildBlaze等)はfunction宣言なのでホイスティングにより
// このブロックより下に書いてあっても参照可能。ただしCHARACTERS自体はconstなので、
// この配列の初期化は「最初にswitchCharacter(CHARACTERS[0].key)を呼ぶより前」に
// 実行されている必要がある(constは巻き上げされないため、ファイル末尾に置くと
// "Cannot access 'CHARACTERS' before initialization" で起動時に落ちる)。
const CHARACTERS = [
  {
    key: "blaze", id: "001", name: "ブレイズ", nameEn: "Blaze", badge: "炎属性",
    badgeGrad: "linear-gradient(180deg,#ff9a52,#e6551a)", textColor: "#5a2200",
    bg: "radial-gradient(circle at 50% 30%, #fff3e8 0%, #ffcf9e 45%, #f08a3c 100%)",
    build: buildBlaze,
  },
  {
    key: "aqua", id: "002", name: "アクア", nameEn: "Aqua", badge: "水属性・回復サポート",
    badgeGrad: "linear-gradient(180deg,#4fc3f7,#0288d1)", textColor: "#0a3a5c",
    bg: "radial-gradient(circle at 50% 30%, #eaf7ff 0%, #bfe6ff 45%, #7fc4f2 100%)",
    build: buildAqua,
  },
  {
    key: "volt", id: "003", name: "ボルト", nameEn: "Volt", badge: "雷属性・高速アタッカー",
    badgeGrad: "linear-gradient(180deg,#ffe066,#e6a800)", textColor: "#4a3a00", badgeTextColor: "#3a2a00",
    bg: "radial-gradient(circle at 50% 30%, #fffef0 0%, #fff2b8 45%, #f0c840 100%)",
    build: buildVolt,
  },
  {
    key: "gust", id: "004", name: "ガスト", nameEn: "Gust", badge: "風属性・機動型アタッカー",
    badgeGrad: "linear-gradient(180deg,#8bd45a,#4c9a2a)", textColor: "#1a4a10",
    bg: "radial-gradient(circle at 50% 30%, #f3fff0 0%, #cdf2c2 45%, #8fd67a 100%)",
    build: buildGust,
  },
  {
    key: "terra", id: "005", name: "テラ", nameEn: "Terra", badge: "岩属性・タンク",
    badgeGrad: "linear-gradient(180deg,#8d9c5c,#5c6b34)", textColor: "#3a2c14",
    bg: "radial-gradient(circle at 50% 30%, #f3ecda 0%, #d9cba0 45%, #a98f5d 100%)",
    build: buildTerra,
  },
  {
    key: "frost", id: "006", name: "フロスト", nameEn: "Frost", badge: "氷属性・妨害型アタッカー",
    badgeGrad: "linear-gradient(180deg,#7fd0f0,#3d94c2)", textColor: "#16374a",
    bg: "radial-gradient(circle at 50% 30%, #eef8ff 0%, #cfe9fb 45%, #8fc3e6 100%)",
    build: buildFrost,
  },
  {
    key: "light", id: "007", name: "ライト", nameEn: "Light", badge: "光属性・バランス型サポーター",

    bg: "radial-gradient(circle at 50% 30%, #fffdf2 0%, #fff2c9 45%, #f0d68a 100%)",
    build: buildLight,
  },
  {
    key: "nox", id: "008", name: "ノクス", nameEn: "Nox", badge: "闇属性・奇襲型アタッカー",

    bg: "radial-gradient(circle at 50% 30%, #241938 0%, #150f24 45%, #08050e 100%)",
    build: buildPlasma,
  },
];

init();
buildTabs();
switchCharacter(CHARACTERS[0].key);
animate();

function init() {
  const container = document.getElementById("app");
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 1.5, 4.6);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.0, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 1.6;
  controls.maxDistance = 9;
  controls.maxPolarAngle = Math.PI * 0.92;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 3.2;
  controls.update();

  clock = new THREE.Clock();
  window.addEventListener("resize", onResize);

  setStatus("OK: three.js r169 / WebGL2=" + (renderer.capabilities.isWebGL2 ? "yes" : "no"));
}

function buildTabs() {
  for (const c of CHARACTERS) {
    const btn = document.createElement("button");
    btn.textContent = c.id + " " + c.name;
    btn.dataset.key = c.key;
    btn.addEventListener("click", () => switchCharacter(c.key));
    tabsEl.appendChild(btn);
  }
}

function switchCharacter(key) {
  if (key === currentKey) return;
  const def = CHARACTERS.find(c => c.key === key);
  if (!def) return;

  if (current && current.dispose) current.dispose();
  while (scene.children.length > 0) scene.remove(scene.children[0]);

  document.body.style.background = def.bg;
  hudNameEl.textContent = def.id + " " + def.name + "  " + def.nameEn;
  hudBadgeEl.textContent = def.badge;
  hudBadgeEl.style.background = def.badgeGrad;
  hudNameEl.style.color = def.textColor;
  hudBadgeEl.style.color = def.badgeTextColor || "#fff";
  document.getElementById("hud").style.color = def.textColor;
  document.getElementById("hint").style.color = def.textColor;
  statusEl.style.color = def.textColor;

  for (const btn of tabsEl.querySelectorAll("button")) {
    btn.classList.toggle("active", btn.dataset.key === key);
  }

  const camPos = def.cameraPos || [0, 1.5, 4.6];
  const camTarget = def.cameraTarget || [0, 1.0, 0];
  camera.position.set(camPos[0], camPos[1], camPos[2]);
  controls.target.set(camTarget[0], camTarget[1], camTarget[2]);
  controls.update();

  setStatus("OK: three.js r169 / WebGL2=" + (renderer.capabilities.isWebGL2 ? "yes" : "no") + " / " + def.id + " " + def.nameEn);
  current = def.build(scene, setStatus);
  currentKey = key;
}

function disposeGroup(obj) {
  obj.traverse((node) => {
    if (node.geometry) node.geometry.dispose();
    if (node.material) {
      const mats = Array.isArray(node.material) ? node.material : [node.material];
      for (const m of mats) {
        for (const k in m) {
          if (m[k] && m[k].isTexture) m[k].dispose();
        }
        m.dispose();
      }
    }
  });
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  try {
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.getElapsedTime();
    if (current && current.update) current.update(t, dt);
    controls.update();
    renderer.render(scene, camera);
  } catch (err) {
    animErrorCount++;
    setStatus("ERROR(" + animErrorCount + "): " + err.message);
    console.error(err);
  }
}

    (gltf) => {
      model = gltf.scene;
      model.traverse((n) => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });

      // glbの元スケール/原点は不明なため、バウンディングボックスを基準に
      // 他の4体とだいたい同じ画角に収まるよう自動調整する。
      const box = new THREE.Box3().setFromObject(model);
      const size = new THREE.Vector3();
      box.getSize(size);
      const center = new THREE.Vector3();
      box.getCenter(center);
      const targetHeight = 1.3;
      const scale = size.y > 0 ? targetHeight / size.y : 1;
      model.scale.setScalar(scale);
      const box2 = new THREE.Box3().setFromObject(model);
      const center2 = new THREE.Vector3();
      box2.getCenter(center2);
      model.position.x -= center2.x;
      model.position.z -= center2.z;
      model.position.y -= box2.min.y;

      root.add(model);

      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(model);
        for (const clip of gltf.animations) mixer.clipAction(clip).play();
      }
      onStatus("OK: three.js r169 / WebGL2=yes / blaze.glb loaded" + (mixer ? " (animated)" : " (static model, no baked animation)"));
    },
    undefined,
    (err) => {
      loadFailed = true;
      onStatus("ERROR loading 001_blaze.glb: " + err.message);
      console.error(err);
    }
  );

  return {
    update(t, dt) {
      if (mixer) mixer.update(dt);
      // アイドルアニメーションがglbに焼き込まれていない場合の簡易な代替演出
      // (完全な静止だと「読み込み失敗」と区別がつかないため、常時ごく僅かな
      // ホバリング揺れだけを足す。元モデルの形状・アニメーションは変更しない)
      if (model && !mixer) {
        model.position.y = 0.03 * Math.sin(t * 1.6);
        model.rotation.y = 0.04 * Math.sin(t * 0.7);
      }
    },
    dispose() {
      disposeGroup(root);
      scene.remove(root);
    },
  };
}

// 002 アクア (Aqua) — output_contrib/Toshiba/element_poc/index.html より移植
// ============================================================
function buildAqua(scene) {
  const root = new THREE.Group();
  scene.add(root);

  const hemi = new THREE.HemisphereLight(0xdff6ff, 0x2b4a63, 1.1);
  root.add(hemi);
  const key = new THREE.DirectionalLight(0xffffff, 2.0);
  key.position.set(3, 5, 4);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.near = 1; key.shadow.camera.far = 15;
  key.shadow.camera.left = -3; key.shadow.camera.right = 3;
  key.shadow.camera.top = 3; key.shadow.camera.bottom = -3;
  root.add(key);
  const fill = new THREE.DirectionalLight(0x9fd8ff, 0.6);
  fill.position.set(-4, 2, -2);
  root.add(fill);
  const rim = new THREE.PointLight(0xbfefff, 1.2, 10);
  rim.position.set(0, 2.6, -3);
  root.add(rim);

  const groundGeo = new THREE.CircleGeometry(3.2, 48);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0xdff3ff, roughness: 0.9, metalness: 0.0, transparent: true, opacity: 0.55 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  root.add(ground);
  for (let i = 0; i < 3; i++) {
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.9 + i * 0.5, 0.95 + i * 0.5, 48),
      new THREE.MeshBasicMaterial({ color: 0x4fc3f7, transparent: true, opacity: 0.18 - i * 0.04, side: THREE.DoubleSide })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.01;
    root.add(ring);
  }

  const aquaGroup = new THREE.Group();
  root.add(aquaGroup);

  const bodyMat = new THREE.MeshPhysicalMaterial({
    color: 0x4fc3f7, roughness: 0.22, metalness: 0.0,
    clearcoat: 0.8, clearcoatRoughness: 0.15, transparent: true, opacity: 0.92,
    sheen: 1.0, sheenColor: 0xbfe9ff,
  });

  const profile = [
    new THREE.Vector2(0.0, 0.0), new THREE.Vector2(0.62, 0.03), new THREE.Vector2(0.78, 0.28),
    new THREE.Vector2(0.74, 0.60), new THREE.Vector2(0.60, 0.92), new THREE.Vector2(0.42, 1.16),
    new THREE.Vector2(0.24, 1.32), new THREE.Vector2(0.10, 1.42), new THREE.Vector2(0.0, 1.46),
  ];
  const bodyGeo = new THREE.LatheGeometry(profile, 48);
  bodyGeo.computeVertexNormals();
  const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
  bodyMesh.castShadow = true; bodyMesh.receiveShadow = true;
  bodyMesh.position.y = 0.05;
  aquaGroup.add(bodyMesh);

  const spoutGroup = new THREE.Group();
  spoutGroup.position.set(0, 1.48, 0);
  aquaGroup.add(spoutGroup);
  const curlPoints = [
    new THREE.Vector3(0, 0, 0), new THREE.Vector3(0.05, 0.18, 0.02), new THREE.Vector3(0.16, 0.34, -0.02),
    new THREE.Vector3(0.10, 0.5, 0.05), new THREE.Vector3(-0.06, 0.6, 0.02), new THREE.Vector3(-0.02, 0.72, -0.02),
  ];
  const curlCurve = new THREE.CatmullRomCurve3(curlPoints);
  const curlGeo = new THREE.TubeGeometry(curlCurve, 40, 0.11, 12, false);
  const curlMesh = new THREE.Mesh(curlGeo, bodyMat);
  curlMesh.castShadow = true;
  spoutGroup.add(curlMesh);
  const curlTip = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 16), bodyMat);
  curlTip.position.copy(curlPoints[curlPoints.length - 1]);
  curlTip.castShadow = true;
  spoutGroup.add(curlTip);

  const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
  const eyePupilMat = new THREE.MeshStandardMaterial({ color: 0x0a2f4a, roughness: 0.4 });
  function makeEye(x) {
    const grp = new THREE.Group();
    const white = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 16), eyeWhiteMat);
    grp.add(white);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 12), eyePupilMat);
    pupil.position.z = 0.08;
    grp.add(pupil);
    const highlight = new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    highlight.position.set(0.03, 0.04, 0.12);
    grp.add(highlight);
    grp.position.set(x, 0.78, 0.66);
    return grp;
  }
  const leftEyeLid = makeEye(-0.22);
  const rightEyeLid = makeEye(0.22);
  aquaGroup.add(leftEyeLid, rightEyeLid);

  function makeArm(sign) {

  }

  const beltMat = new THREE.MeshStandardMaterial({ color: 0x0d3a5c, roughness: 0.5 });
  const belt = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.06, 12, 40), beltMat);
  belt.rotation.x = Math.PI / 2;
  belt.position.y = 0.42;
  belt.castShadow = true;
  aquaGroup.add(belt);
  const emblem = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 12), new THREE.MeshStandardMaterial({ color: 0xbfefff, emissive: 0x2196f3, emissiveIntensity: 0.4, roughness: 0.2 }));
  emblem.position.set(0, 0.42, 0.62);
  aquaGroup.add(emblem);

  function makeFoot(sign) {
    const foot = new THREE.Mesh(new THREE.SphereGeometry(0.15, 14, 14), bodyMat);
    foot.scale.set(1.1, 0.6, 1.2);
    foot.position.set(sign * 0.28, 0.06, 0.15);
    foot.castShadow = true;
    return foot;
  }
  aquaGroup.add(makeFoot(-1), makeFoot(1));

  const bubbles = [];
  const bubbleGeo = new THREE.SphereGeometry(1, 12, 12);
  const bubbleMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.35, roughness: 0.05, transmission: 0.6, thickness: 0.3 });
  for (let i = 0; i < 14; i++) {
    const s = 0.04 + Math.random() * 0.07;
    const m = new THREE.Mesh(bubbleGeo, bubbleMat);
    m.scale.setScalar(s);
    const angle = Math.random() * Math.PI * 2;
    const radius = 0.5 + Math.random() * 0.9;
    m.userData = {
      baseX: Math.cos(angle) * radius, baseZ: Math.sin(angle) * radius,
      speed: 0.25 + Math.random() * 0.35, phase: Math.random() * Math.PI * 2,
      freq: 0.6 + Math.random() * 0.6, startY: Math.random() * 2.0,
    };
    m.position.set(m.userData.baseX, m.userData.startY, m.userData.baseZ);
    bubbles.push(m);
    root.add(m);
  }

  let blinkTimer = 2.0;
  let blinkPhase = 0;

  return {
    cameraPos: [0, 1.55, 4.6],
    cameraTarget: [0, 1.05, 0],
    update(t, dt) {
      aquaGroup.position.y = Math.sin(t * 2.0) * 0.05;
      const squash = Math.sin(t * 2.0) * 0.05;
      aquaGroup.scale.set(1 - squash * 0.6, 1 + squash, 1 - squash * 0.6);
      aquaGroup.rotation.z = Math.sin(t * 1.3) * 0.045;
      aquaGroup.rotation.x = Math.sin(t * 1.1 + 1.0) * 0.02;
      spoutGroup.rotation.z = Math.sin(t * 1.7 + 0.6) * 0.35;
      spoutGroup.rotation.x = Math.sin(t * 1.4 + 0.2) * 0.15;

      blinkTimer -= dt;
      if (blinkTimer <= 0) {
        blinkPhase += dt * 10;
        const s = Math.max(0.06, Math.abs(Math.cos(blinkPhase * Math.PI)));
        leftEyeLid.scale.y = s; rightEyeLid.scale.y = s;
        if (blinkPhase >= 1) {
          blinkPhase = 0; leftEyeLid.scale.y = 1; rightEyeLid.scale.y = 1;
          blinkTimer = 2.5 + Math.random() * 2.5;
        }
      }

      for (const b of bubbles) {
        const u = b.userData;
        let y = b.position.y + u.speed * dt;
        if (y > 2.2) y = 0.0;
        b.position.y = y;
        b.position.x = u.baseX + Math.sin(t * u.freq + u.phase) * 0.08;
        b.position.z = u.baseZ + Math.cos(t * u.freq + u.phase) * 0.08;
        const life = y / 2.2;
        b.material.opacity = 0.4 * (1.0 - Math.abs(life - 0.5) * 0.6);
      }
    },
    dispose() { disposeGroup(root); scene.remove(root); },
  };
}

  root.add(ground);
  for (let i = 0; i < 3; i++) {
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.9 + i * 0.5, 0.95 + i * 0.5, 48),
      new THREE.MeshBasicMaterial({ color: 0xffe066, transparent: true, opacity: 0.2 - i * 0.05, side: THREE.DoubleSide })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.01;
    root.add(ring);
  }

  const voltGroup = new THREE.Group();
  root.add(voltGroup);

  const bodyMat = new THREE.MeshPhysicalMaterial({ color: 0xffcf33, roughness: 0.3, metalness: 0.05, clearcoat: 0.6, clearcoatRoughness: 0.2, sheen: 0.6, sheenColor: 0xfff2a0 });
  const robeMat = new THREE.MeshStandardMaterial({ color: 0x1b1b22, roughness: 0.55, metalness: 0.1 });
  const spikeMat = new THREE.MeshPhysicalMaterial({ color: 0xffe14d, roughness: 0.25, metalness: 0.0, emissive: 0xffb800, emissiveIntensity: 0.25, clearcoat: 0.7 });

  const profile = [
    new THREE.Vector2(0.0, 0.0), new THREE.Vector2(0.5, 0.02), new THREE.Vector2(0.62, 0.22),
    new THREE.Vector2(0.58, 0.48), new THREE.Vector2(0.60, 0.62), new THREE.Vector2(0.50, 0.86),
    new THREE.Vector2(0.34, 1.04), new THREE.Vector2(0.16, 1.16), new THREE.Vector2(0.0, 1.20),
  ];
  const bodyGeo = new THREE.LatheGeometry(profile, 48);
  bodyGeo.computeVertexNormals();
  const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
  bodyMesh.castShadow = true; bodyMesh.receiveShadow = true;
  bodyMesh.position.y = 0.05;
  voltGroup.add(bodyMesh);

  const robeGeo = new THREE.CylinderGeometry(0.30, 0.56, 0.42, 40, 1, true);
  const robeMesh = new THREE.Mesh(robeGeo, robeMat);
  robeMesh.position.y = 0.26;
  robeMesh.castShadow = true;
  voltGroup.add(robeMesh);

  const spikeGroup = new THREE.Group();
  spikeGroup.position.set(0, 1.15, 0);
  voltGroup.add(spikeGroup);
  const spikes = [];
  const spikeDefs = [
    [0.0, 0.05, 0.62, 0.13], [0.55, 0.35, 0.50, 0.11], [1.15, 0.55, 0.40, 0.10],
    [1.9, 0.7, 0.34, 0.09], [2.7, 0.75, 0.30, 0.09], [3.5, 0.7, 0.34, 0.09],
    [4.3, 0.55, 0.40, 0.10], [5.05, 0.35, 0.50, 0.11], [5.75, 0.15, 0.58, 0.12],
  ];
  for (const [angle, tilt, len, radius] of spikeDefs) {
    const spike = new THREE.Mesh(new THREE.ConeGeometry(radius, len, 6), spikeMat);
    spike.castShadow = true;
    const x = Math.sin(angle) * 0.14;
    const z = Math.cos(angle) * 0.14;
    spike.position.set(x, len * 0.42, z);
    spike.rotation.z = Math.sin(angle) * tilt;
    spike.rotation.x = -Math.cos(angle) * tilt + 0.15;
    spike.userData = { baseRotX: spike.rotation.x, baseRotZ: spike.rotation.z, phase: Math.random() * Math.PI * 2 };
    spikes.push(spike);
    spikeGroup.add(spike);
  }

  const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
  const eyePupilMat = new THREE.MeshStandardMaterial({ color: 0x1b1b22, roughness: 0.4 });
  function makeEye(x) {
    const grp = new THREE.Group();
    const white = new THREE.Mesh(new THREE.SphereGeometry(0.115, 16, 16), eyeWhiteMat);
    grp.add(white);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.062, 12, 12), eyePupilMat);
    pupil.position.z = 0.08;
    grp.add(pupil);
    const highlight = new THREE.Mesh(new THREE.SphereGeometry(0.022, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    highlight.position.set(0.03, 0.04, 0.12);
    grp.add(highlight);
    grp.position.set(x, 0.68, 0.58);
    return grp;
  }
  const leftEye = makeEye(-0.20);
  const rightEye = makeEye(0.20);
  voltGroup.add(leftEye, rightEye);

  function makeArm(sign) {
    const armGroup = new THREE.Group();
    const upper = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), bodyMat);
    upper.scale.set(1.0, 1.2, 0.7);
    upper.position.set(sign * 0.62, 0.46, 0.06);
    upper.rotation.z = sign * 0.4;
    upper.castShadow = true;
    armGroup.add(upper);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 12), robeMat);
    hand.position.set(sign * 0.76, 0.30, 0.10);
    hand.castShadow = true;
    armGroup.add(hand);
    return armGroup;
  }
  voltGroup.add(makeArm(-1), makeArm(1));

  const emblemGroup = new THREE.Group();
  emblemGroup.position.set(0, 0.62, 0.58);
  const emblemMat = new THREE.MeshStandardMaterial({ color: 0xfff59d, emissive: 0xffcc00, emissiveIntensity: 0.7, roughness: 0.2 });
  const boltShape = new THREE.Shape();
  boltShape.moveTo(0.03, 0.14);
  boltShape.lineTo(-0.07, 0.0);
  boltShape.lineTo(-0.01, -0.01);
  boltShape.lineTo(-0.06, -0.14);
  boltShape.lineTo(0.08, 0.015);
  boltShape.lineTo(0.015, 0.02);
  boltShape.lineTo(0.03, 0.14);
  const boltGeo = new THREE.ExtrudeGeometry(boltShape, { depth: 0.02, bevelEnabled: false });
  const emblemMesh = new THREE.Mesh(boltGeo, emblemMat);
  emblemGroup.add(emblemMesh);
  voltGroup.add(emblemGroup);

  const beltMat = new THREE.MeshStandardMaterial({ color: 0x1b1b22, roughness: 0.5 });
  const belt = new THREE.Mesh(new THREE.TorusGeometry(0.56, 0.05, 12, 40), beltMat);
  belt.rotation.x = Math.PI / 2;
  belt.position.y = 0.44;
  belt.castShadow = true;
  voltGroup.add(belt);

  function makeFoot(sign) {
    const foot = new THREE.Mesh(new THREE.SphereGeometry(0.14, 14, 14), robeMat);
    foot.scale.set(1.1, 0.6, 1.2);
    foot.position.set(sign * 0.24, 0.05, 0.14);
    foot.castShadow = true;
    return foot;
  }
  voltGroup.add(makeFoot(-1), makeFoot(1));

  const sparkBolts = [];
  const sparkMat = new THREE.MeshBasicMaterial({ color: 0xfff9c4, transparent: true, opacity: 0.0 });
  for (let i = 0; i < 7; i++) {
    const points = [];
    let x = 0, y = 0;
    const segs = 5;
    for (let s = 0; s <= segs; s++) {
      x += (Math.random() - 0.5) * 0.08;
      y = -s * 0.05;
      points.push(new THREE.Vector3(x, y, 0));
    }
    const curve = new THREE.CatmullRomCurve3(points);
    const geo = new THREE.TubeGeometry(curve, 16, 0.012, 6, false);
    const mesh = new THREE.Mesh(geo, sparkMat.clone());
    const angle = Math.random() * Math.PI * 2;
    const radius = 0.55 + Math.random() * 0.55;
    mesh.userData = {
      baseAngle: angle, radius: radius, speed: 0.3 + Math.random() * 0.4,
      baseY: 0.3 + Math.random() * 1.0, cycle: 1.2 + Math.random() * 1.6, offset: Math.random() * 10,
    };
    sparkBolts.push(mesh);
    root.add(mesh);
  }

  let blinkTimer = 2.0, blinkPhase = 0;
  let flashTimer = 2.5, flashPhase = 0;

  return {
    cameraPos: [0, 1.5, 4.4],
    cameraTarget: [0, 1.0, 0],
    update(t, dt) {
      voltGroup.position.y = 0.05 + Math.sin(t * 2.6) * 0.06;
      const squash = Math.sin(t * 2.6 + 0.3) * 0.035;
      voltGroup.scale.set(1 - squash * 0.6, 1 + squash, 1 - squash * 0.6);
      voltGroup.rotation.z = Math.sin(t * 1.4) * 0.05 + Math.sin(t * 9.0) * 0.01;
      voltGroup.rotation.x = Math.sin(t * 1.1 + 1.0) * 0.025;

      for (const spike of spikes) {
        const u = spike.userData;
        spike.rotation.x = u.baseRotX + Math.sin(t * 12.0 + u.phase) * 0.03;
        spike.rotation.z = u.baseRotZ + Math.cos(t * 10.0 + u.phase * 1.3) * 0.03;
      }

      blinkTimer -= dt;
      if (blinkTimer <= 0) {
        blinkPhase += dt * 10;
        const s = Math.max(0.06, Math.abs(Math.cos(blinkPhase * Math.PI)));
        leftEye.scale.y = s; rightEye.scale.y = s;
        if (blinkPhase >= 1) {
          blinkPhase = 0; leftEye.scale.y = 1; rightEye.scale.y = 1;
          blinkTimer = 2.0 + Math.random() * 2.5;
        }
      }

      flashTimer -= dt;
      if (flashTimer <= 0) {
        flashPhase += dt * 6;
        const glow = Math.max(0, Math.sin(flashPhase * Math.PI));
        for (const spike of spikes) spike.material.emissiveIntensity = 0.25 + glow * 1.3;
        emblemMesh.material.emissiveIntensity = 0.7 + glow * 1.0;
        if (flashPhase >= 1) {
          flashPhase = 0;
          flashTimer = 3.0 + Math.random() * 3.0;
        }
      }

      for (const bolt of sparkBolts) {
        const u = bolt.userData;
        const angle = u.baseAngle + t * u.speed;
        bolt.position.x = Math.cos(angle) * u.radius;
        bolt.position.z = Math.sin(angle) * u.radius;
        bolt.position.y = u.baseY + Math.sin(t * 0.6 + u.offset) * 0.15;
        bolt.rotation.y = angle;
        bolt.rotation.z = Math.sin(t * 3.0 + u.offset) * 0.3;
        const cyclePos = ((t + u.offset) % u.cycle) / u.cycle;
        const flicker = cyclePos < 0.15 ? (cyclePos / 0.15) : (cyclePos < 0.3 ? 1 - (cyclePos - 0.15) / 0.15 : 0);
        bolt.material.opacity = flicker * 0.9;
      }
    },
    dispose() { disposeGroup(root); scene.remove(root); },
  };
}

  const spiralMesh = new THREE.Mesh(new THREE.TubeGeometry(spiralCurve, 32, 0.018, 8, true), emblemMat);
  emblemGroup.add(spiralMesh);
  gustGroup.add(emblemGroup);

  function makeFoot(sign) {
    const foot = new THREE.Mesh(new THREE.SphereGeometry(0.14, 14, 14), bodyMat);
    foot.scale.set(1.1, 0.6, 1.2);
    foot.position.set(sign * 0.26, 0.05, 0.14);
    foot.castShadow = true;
    return foot;
  }
  gustGroup.add(makeFoot(-1), makeFoot(1));

  const leaves = [];
  const leafMat2 = new THREE.MeshStandardMaterial({ color: 0x6fcf4a, roughness: 0.4, side: THREE.DoubleSide });
  const leafShape = new THREE.Shape();
  leafShape.moveTo(0, 0);
  leafShape.quadraticCurveTo(0.06, 0.05, 0.0, 0.12);
  leafShape.quadraticCurveTo(-0.06, 0.05, 0, 0);
  const leafGeo = new THREE.ShapeGeometry(leafShape);
  for (let i = 0; i < 12; i++) {
    const m = new THREE.Mesh(leafGeo, leafMat2);
    const angle = Math.random() * Math.PI * 2;
    const radius = 0.7 + Math.random() * 1.0;
    m.userData = {
      baseAngle: angle, radius: radius, speed: 0.5 + Math.random() * 0.6,
      bobFreq: 0.8 + Math.random() * 0.8, bobPhase: Math.random() * Math.PI * 2,
      baseY: 0.3 + Math.random() * 1.3,
    };
    leaves.push(m);
    root.add(m);
  }

  let blinkTimer = 2.0, blinkPhase = 0;

  return {
    cameraPos: [0, 1.5, 4.4],
    cameraTarget: [0, 1.0, 0],
    update(t, dt) {
      gustGroup.position.y = 0.06 + Math.sin(t * 1.8) * 0.08;
      const squash = Math.sin(t * 1.8 + 0.3) * 0.04;
      gustGroup.scale.set(1 - squash * 0.6, 1 + squash, 1 - squash * 0.6);
      gustGroup.rotation.z = Math.sin(t * 1.1) * 0.06;
      gustGroup.rotation.x = Math.sin(t * 0.9 + 1.0) * 0.03;
      crestGroup.rotation.z = Math.sin(t * 2.6 + 0.6) * 0.4 + Math.sin(t * 7.0) * 0.05;
      crestGroup.rotation.x = Math.sin(t * 2.1 + 0.2) * 0.18;
      capeGroup.rotation.x = Math.sin(t * 2.4) * 0.25 - 0.1;
      capeGroup.rotation.z = Math.sin(t * 1.9 + 0.4) * 0.12;

      blinkTimer -= dt;
      if (blinkTimer <= 0) {
        blinkPhase += dt * 10;
        const s = Math.max(0.06, Math.abs(Math.cos(blinkPhase * Math.PI)));
        leftEye.scale.y = s; rightEye.scale.y = s;
        if (blinkPhase >= 1) {
          blinkPhase = 0; leftEye.scale.y = 1; rightEye.scale.y = 1;
          blinkTimer = 2.5 + Math.random() * 2.5;
        }
      }

      for (const leaf of leaves) {
        const u = leaf.userData;
        const angle = u.baseAngle + t * u.speed;
        leaf.position.x = Math.cos(angle) * u.radius;
        leaf.position.z = Math.sin(angle) * u.radius;
        leaf.position.y = u.baseY + Math.sin(t * u.bobFreq + u.bobPhase) * 0.18;
        leaf.rotation.x = t * 1.5 + u.bobPhase;
        leaf.rotation.y = t * 1.1 + u.bobPhase;
        leaf.rotation.z = angle;
      }
    },
    dispose() { disposeGroup(root); scene.remove(root); },
  };
}

function buildTerra(scene) {
  const root = new THREE.Group();
  scene.add(root);

  const hemi = new THREE.HemisphereLight(0xf6ecc8, 0x3a2f1a, 1.1);
  root.add(hemi);

  fill.position.set(-4, 2, -2);
  root.add(fill);
  const rim = new THREE.PointLight(0xffe3a8, 1.1, 10);
  rim.position.set(0, 2.6, -3);
  root.add(rim);

  const groundGeo = new THREE.CircleGeometry(3.2, 48);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0xc9b788, roughness: 0.95, metalness: 0.0, transparent: true, opacity: 0.6 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  root.add(ground);

  const pebbleMat = new THREE.MeshStandardMaterial({ color: 0x8a7b5e, roughness: 1.0, flatShading: true });
  for (let i = 0; i < 10; i++) {
    const s = 0.05 + Math.random() * 0.09;
    const geo2 = new THREE.IcosahedronGeometry(s, 0);
    const m = new THREE.Mesh(geo2, pebbleMat);
    const angle = Math.random() * Math.PI * 2;
    const radius = 1.1 + Math.random() * 1.7;
    m.position.set(Math.cos(angle) * radius, s * 0.4, Math.sin(angle) * radius);
    m.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
    m.receiveShadow = true; m.castShadow = true;
    root.add(m);
  }

  function makeRockGeometry(radius, detail, roughAmount) {
    const geo = new THREE.IcosahedronGeometry(radius, detail);
    const pos = geo.attributes.position;
    const v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      const n = v.clone().normalize();
      const offset = ((Math.sin(i * 12.9898) * 43758.5453) % 1) * roughAmount;
      v.addScaledVector(n, offset);
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    geo.computeVertexNormals();
    return geo;
  }

  const terraGroup = new THREE.Group();
  root.add(terraGroup);

  const rockMat = new THREE.MeshStandardMaterial({ color: 0x8f8272, roughness: 0.95, metalness: 0.04, flatShading: true });
  const rockMatDark = new THREE.MeshStandardMaterial({ color: 0x6f6455, roughness: 0.95, metalness: 0.04, flatShading: true });
  const mossMat = new THREE.MeshStandardMaterial({ color: 0x6f8f3e, roughness: 0.9, metalness: 0.0, flatShading: true });

  const bodyGeo = makeRockGeometry(0.68, 1, 0.06);
  const bodyMesh = new THREE.Mesh(bodyGeo, rockMat);
  bodyMesh.scale.set(1.08, 0.92, 1.05);
  bodyMesh.position.y = 0.72;
  bodyMesh.castShadow = true; bodyMesh.receiveShadow = true;
  terraGroup.add(bodyMesh);

  const headGroup = new THREE.Group();
  headGroup.position.set(0, 1.34, 0.03);
  terraGroup.add(headGroup);

  const headGeo = makeRockGeometry(0.40, 1, 0.05);
  const headMesh = new THREE.Mesh(headGeo, rockMat);
  headMesh.castShadow = true; headMesh.receiveShadow = true;
  headGroup.add(headMesh);

  const spikeGeo = new THREE.ConeGeometry(0.16, 0.38, 6);
  const spike = new THREE.Mesh(spikeGeo, rockMatDark);
  spike.position.set(0.02, 0.46, -0.05);
  spike.rotation.z = -0.12;
  spike.castShadow = true;
  headGroup.add(spike);

  const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xfff6e0, roughness: 0.35 });
  const eyePupilMat = new THREE.MeshStandardMaterial({ color: 0xcc7a1f, roughness: 0.35, emissive: 0x5a2e00, emissiveIntensity: 0.15 });
  function makeEye(x) {
    const grp = new THREE.Group();
    const white = new THREE.Mesh(new THREE.SphereGeometry(0.115, 16, 16), eyeWhiteMat);
    grp.add(white);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.065, 12, 12), eyePupilMat);
    pupil.position.z = 0.085;
    grp.add(pupil);
    const highlight = new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    highlight.position.set(0.03, 0.04, 0.13);
    grp.add(highlight);
    grp.position.set(x, 0.02, 0.36);
    return grp;
  }
  const leftEyeLid = makeEye(-0.18);
  const rightEyeLid = makeEye(0.18);
  headGroup.add(leftEyeLid, rightEyeLid);

  const mossPatches = [];
  function makeMoss(x, y, z, s, parent) {
    const geo = makeRockGeometry(s, 0, s * 0.35);
    const m = new THREE.Mesh(geo, mossMat);
    m.scale.set(1.0, 0.55, 1.0);
    m.position.set(x, y, z);
    m.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
    m.castShadow = true;
    m.userData = { baseRot: m.rotation.z, phase: Math.random() * Math.PI * 2, freq: 1.4 + Math.random() * 1.2, amp: 0.06 + Math.random() * 0.05 };
    parent.add(m);
    mossPatches.push(m);
  }
  makeMoss(0.05, 0.34, -0.30, 0.20, headGroup);
  makeMoss(-0.62, 0.30, -0.35, 0.22, terraGroup);
  makeMoss(0.60, 0.55, -0.30, 0.19, terraGroup);
  makeMoss(0.0, -0.55, -0.55, 0.24, terraGroup);
  makeMoss(-0.30, -0.75, 0.30, 0.14, terraGroup);

  function makeArm(sign) {
    const grp = new THREE.Group();
    const upperGeo = makeRockGeometry(0.20, 0, 0.03);
    const upper = new THREE.Mesh(upperGeo, rockMat);
    upper.scale.set(1.0, 1.5, 1.0);
    upper.castShadow = true;
    grp.add(upper);
    const fistGeo = makeRockGeometry(0.17, 0, 0.03);
    const fist = new THREE.Mesh(fistGeo, rockMatDark);
    fist.position.y = -0.32;
    fist.castShadow = true;
    grp.add(fist);
    grp.position.set(sign * 0.78, 0.62, 0.05);
    grp.rotation.z = sign * 0.28;
    return grp;
  }
  terraGroup.add(makeArm(-1), makeArm(1));

  function makeLeg(sign) {
    const grp = new THREE.Group();
    const legGeo = makeRockGeometry(0.19, 0, 0.02);
    const leg = new THREE.Mesh(legGeo, rockMat);
    leg.scale.set(1.0, 0.9, 1.0);
    leg.castShadow = true;
    grp.add(leg);
    const footGeo = makeRockGeometry(0.17, 0, 0.02);
    const foot = new THREE.Mesh(footGeo, rockMatDark);
    foot.scale.set(1.2, 0.6, 1.35);
    foot.position.set(0, -0.14, 0.06);
    foot.castShadow = true;
    grp.add(foot);
    grp.position.set(sign * 0.32, 0.14, 0.08);
    return grp;
  }
  terraGroup.add(makeLeg(-1), makeLeg(1));

  const beltMat = new THREE.MeshStandardMaterial({ color: 0x4a3f2c, roughness: 0.6 });
  const belt = new THREE.Mesh(new THREE.TorusGeometry(0.30, 0.045, 12, 32), beltMat);
  belt.rotation.x = Math.PI / 2;
  belt.position.set(0, 0.68, 0.60);
  belt.castShadow = true;
  terraGroup.add(belt);
  const emblem = new THREE.Mesh(new THREE.SphereGeometry(0.10, 12, 12), new THREE.MeshStandardMaterial({ color: 0xe0b23c, emissive: 0x7a4f0a, emissiveIntensity: 0.35, roughness: 0.3, metalness: 0.5 }));
  emblem.position.set(0, 0.68, 0.66);
  terraGroup.add(emblem);

  const debris = [];
  const dustMat = new THREE.MeshStandardMaterial({ color: 0xb79f78, roughness: 1.0, transparent: true, opacity: 0.6, flatShading: true });
  const pebbleMat2 = new THREE.MeshStandardMaterial({ color: 0x7a6c53, roughness: 1.0, flatShading: true });
  for (let i = 0; i < 16; i++) {
    const isPebble = i % 4 === 0;
    const s = isPebble ? (0.03 + Math.random() * 0.05) : (0.02 + Math.random() * 0.05);
    const geo = isPebble ? new THREE.IcosahedronGeometry(s, 0) : new THREE.BoxGeometry(s, s, s);
    const m = new THREE.Mesh(geo, isPebble ? pebbleMat2 : dustMat);
    const angle = Math.random() * Math.PI * 2;
    const radius = 0.4 + Math.random() * 1.0;
    m.userData = {
      baseX: Math.cos(angle) * radius, baseZ: Math.sin(angle) * radius,
      speed: 0.12 + Math.random() * 0.22, phase: Math.random() * Math.PI * 2,
      freq: 0.5 + Math.random() * 0.5, startY: Math.random() * 1.6,
      spinX: (Math.random() - 0.5) * 2.0, spinY: (Math.random() - 0.5) * 2.0,
    };
    m.position.set(m.userData.baseX, m.userData.startY, m.userData.baseZ);
    debris.push(m);
    root.add(m);
  }

  let blinkTimer = 2.0, blinkPhase = 0;

  return {
    cameraPos: [0, 1.5, 4.6],
    cameraTarget: [0, 1.0, 0],
    update(t, dt) {
      const squash = Math.sin(t * 1.15) * 0.035;
      terraGroup.scale.set(1 + squash * 0.5, 1 - squash, 1 + squash * 0.5);
      terraGroup.position.y = Math.sin(t * 1.15) * 0.015;
      const tremor = Math.sin(t * 14.0) * 0.008 + Math.sin(t * 9.3 + 1.4) * 0.006;
      terraGroup.rotation.z = tremor;
      terraGroup.rotation.x = Math.sin(t * 0.9 + 0.5) * 0.012;
      headGroup.rotation.x = Math.sin(t * 0.8) * 0.03;
      headGroup.rotation.y = Math.sin(t * 0.5 + 1.0) * 0.05;

      for (const m of mossPatches) {
        const u = m.userData;
        m.rotation.z = u.baseRot + Math.sin(t * u.freq + u.phase) * u.amp;
      }

      blinkTimer -= dt;
      if (blinkTimer <= 0) {
        blinkPhase += dt * 9;
        const s = Math.max(0.06, Math.abs(Math.cos(blinkPhase * Math.PI)));
        leftEyeLid.scale.y = s; rightEyeLid.scale.y = s;
        if (blinkPhase >= 1) {
          blinkPhase = 0; leftEyeLid.scale.y = 1; rightEyeLid.scale.y = 1;
          blinkTimer = 2.8 + Math.random() * 2.5;
        }
      }

      for (const d of debris) {
        const u = d.userData;
        let y = d.position.y + u.speed * dt;
        if (y > 1.8) y = 0.0;
        d.position.y = y;
        d.position.x = u.baseX + Math.sin(t * u.freq + u.phase) * 0.06;
        d.position.z = u.baseZ + Math.cos(t * u.freq + u.phase) * 0.06;
        d.rotation.x += u.spinX * dt;
        d.rotation.y += u.spinY * dt;
        const life = y / 1.8;
        d.material.opacity = 0.55 * (1.0 - Math.abs(life - 0.5) * 0.7);
      }
    },
    dispose() { disposeGroup(root); scene.remove(root); },
  };
}

    const s = 0.08 + Math.random() * 0.12;

    const m = new THREE.Mesh(geo, mistMat.clone());
    const angle = Math.random() * Math.PI * 2;
    const radius = 0.3 + Math.random() * 0.7;
    m.userData = { baseX: Math.cos(angle) * radius, baseZ: Math.sin(angle) * radius, speed: 0.14 + Math.random() * 0.18, phase: Math.random() * Math.PI * 2, freq: 0.4 + Math.random() * 0.4, startY: Math.random() * 1.8 };
    m.position.set(m.userData.baseX, m.userData.startY, m.userData.baseZ);
    mistParticles.push(m);
    root.add(m);
  }

  let blinkTimer = 2.0, blinkPhase = 0;

  return {
    cameraPos: [0, 1.5, 4.6],
    cameraTarget: [0, 1.0, 0],
    update(t, dt) {
      const squash = Math.sin(t * 1.0) * 0.02;
      frostGroup.scale.set(1 - squash * 0.4, 1 + squash, 1 - squash * 0.4);
      frostGroup.position.y = Math.sin(t * 1.0) * 0.01;
      headGroup.rotation.y = Math.sin(t * 0.55) * 0.09;
      headGroup.rotation.x = Math.sin(t * 0.7 + 0.6) * 0.02;

      for (const c of crystalSpikes) {
        const s = c.baseScale + Math.sin(t * c.freq + c.phase) * 0.06;
        c.mesh.scale.set(s, 1, s);
      }

      blinkTimer -= dt;
      if (blinkTimer <= 0) {
        blinkPhase += dt * 9;
        const s = Math.max(0.06, Math.abs(Math.cos(blinkPhase * Math.PI)));
        leftEyeLid.scale.y = s; rightEyeLid.scale.y = s;
        if (blinkPhase >= 1) {
          blinkPhase = 0; leftEyeLid.scale.y = 1; rightEyeLid.scale.y = 1;
          blinkTimer = 2.6 + Math.random() * 2.6;
        }
      }

      for (const m of mistParticles) {
        const u = m.userData;
        let y = m.position.y + u.speed * dt;
        if (y > 2.0) y = 0.0;
        m.position.y = y;
        m.position.x = u.baseX + Math.sin(t * u.freq + u.phase) * 0.08;
        m.position.z = u.baseZ + Math.cos(t * u.freq + u.phase) * 0.08;
        const life = y / 2.0;
        m.material.opacity = 0.32 * (1.0 - life) * (life < 0.15 ? life / 0.15 : 1.0);
      }
    },
    dispose() { disposeGroup(root); scene.remove(root); },
  };
}

// 007 ライト (Light) — output_contrib/DELL/element_poc/light.html より移植
// ============================================================
function buildLight(scene) {
  const root = new THREE.Group();
  scene.add(root);

  const hemi = new THREE.HemisphereLight(0xfff8e0, 0x6a5220, 1.3);
  root.add(hemi);
  const key = new THREE.DirectionalLight(0xfff4d0, 2.2);
  key.position.set(3, 5, 4);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.near = 1; key.shadow.camera.far = 15;
  key.shadow.camera.left = -3; key.shadow.camera.right = 3;
  key.shadow.camera.top = 3; key.shadow.camera.bottom = -3;
  root.add(key);
  const fill = new THREE.DirectionalLight(0xffe8a0, 0.7);
  fill.position.set(-4, 2, -2);
  root.add(fill);
  const rim = new THREE.PointLight(0xfff0c0, 1.4, 10);
  rim.position.set(0, 2.8, -3);
  root.add(rim);

  const groundGeo = new THREE.CircleGeometry(3.2, 48);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0xfff3cf, roughness: 0.5, metalness: 0.0, transparent: true, opacity: 0.55 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  root.add(ground);

  const lightGroup = new THREE.Group();
  root.add(lightGroup);

  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xfffaf0, roughness: 0.35, metalness: 0.02 });
  const goldMat = new THREE.MeshStandardMaterial({ color: 0xe8bf4a, roughness: 0.3, metalness: 0.55, emissive: 0x6a4a00, emissiveIntensity: 0.15 });
  const wingMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4, transparent: true, opacity: 0.92, side: THREE.DoubleSide });

  const bodyGeo = new THREE.SphereGeometry(0.60, 24, 20);
  bodyGeo.scale(1.0, 0.98, 1.0);
  const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
  bodyMesh.position.y = 0.66;
  bodyMesh.castShadow = true; bodyMesh.receiveShadow = true;
  lightGroup.add(bodyMesh);

  const collar = new THREE.Mesh(new THREE.TorusGeometry(0.32, 0.05, 10, 28), goldMat);
  collar.rotation.x = Math.PI / 2;
  collar.position.set(0, 0.48, 0.02);
  collar.castShadow = true;
  lightGroup.add(collar);
  const collarGem = new THREE.Mesh(new THREE.OctahedronGeometry(0.09, 0), goldMat);
  collarGem.position.set(0, 0.48, 0.34);
  lightGroup.add(collarGem);

  const headGroup = new THREE.Group();
  headGroup.position.set(0, 1.30, 0.0);
  lightGroup.add(headGroup);
  const headGeo = new THREE.SphereGeometry(0.42, 22, 18);
  const headMesh = new THREE.Mesh(headGeo, bodyMat);
  headMesh.castShadow = true; headMesh.receiveShadow = true;
  headGroup.add(headMesh);

  const haloGroup = new THREE.Group();
  haloGroup.position.set(0, 0.70, -0.02);
  headGroup.add(haloGroup);
  const halo = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.03, 12, 36), goldMat);
  halo.rotation.x = Math.PI / 2.05;
  haloGroup.add(halo);
  const haloStar = new THREE.Mesh(new THREE.OctahedronGeometry(0.045, 0), new THREE.MeshStandardMaterial({ color: 0xfff6d8, emissive: 0xffe27a, emissiveIntensity: 0.8 }));
  haloStar.position.set(0.26, 0.02, 0);
  haloGroup.add(haloStar);

  const curlGeo = new THREE.ConeGeometry(0.07, 0.34, 8);
  const curl = new THREE.Mesh(curlGeo, bodyMat);
  curl.position.set(0.03, 0.44, -0.02);
  curl.rotation.z = -0.35;
  curl.rotation.x = 0.15;
  curl.castShadow = true;
  headGroup.add(curl);

  const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
  const eyePupilMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 0.3 });
  function makeEye(x) {
    const grp = new THREE.Group();
    const white = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), eyeWhiteMat);
    grp.add(white);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 12), eyePupilMat);
    pupil.position.z = 0.09;
    grp.add(pupil);
    const highlight = new THREE.Mesh(new THREE.SphereGeometry(0.022, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    highlight.position.set(0.03, 0.04, 0.14);
    grp.add(highlight);
    grp.position.set(x, -0.02, 0.36);
    return grp;
  }
  const leftEyeLid = makeEye(-0.17);
  const rightEyeLid = makeEye(0.17);
  headGroup.add(leftEyeLid, rightEyeLid);

  function makeWing(sign) {
    const grp = new THREE.Group();
    for (let i = 0; i < 4; i++) {
      const w = 0.22 - i * 0.03;
      const h = 0.30 - i * 0.04;
      const geo = new THREE.CircleGeometry(1, 12, 0, Math.PI);
      geo.scale(w, h, 1);
      const feather = new THREE.Mesh(geo, wingMat);
      feather.position.set(sign * (0.12 + i * 0.16), 0.05 - i * 0.10, -0.05 - i * 0.02);
      feather.rotation.y = sign * (Math.PI / 2 + 0.3 + i * 0.08);
      feather.rotation.z = sign * (0.15 - i * 0.05);
      feather.castShadow = true;
      grp.add(feather);
    }
    grp.position.set(sign * 0.42, 0.62, -0.15);
    return grp;
  }
  const leftWing = makeWing(-1);
  const rightWing = makeWing(1);
  lightGroup.add(leftWing, rightWing);

  function makeArm(sign) {
    const grp = new THREE.Group();
    const upperGeo = new THREE.SphereGeometry(0.13, 14, 12);
    upperGeo.scale(1.0, 1.5, 1.0);
    const upper = new THREE.Mesh(upperGeo, bodyMat);
    upper.castShadow = true;
    grp.add(upper);
    const handGeo = new THREE.SphereGeometry(0.10, 12, 10);
    const hand = new THREE.Mesh(handGeo, bodyMat);
    hand.position.y = -0.24;
    hand.castShadow = true;
    grp.add(hand);
    grp.position.set(sign * 0.58, 0.60, 0.06);
    grp.rotation.z = sign * 0.24;
    return grp;
  }
  lightGroup.add(makeArm(-1), makeArm(1));

  function makeLeg(sign) {
    const geo = new THREE.SphereGeometry(0.15, 14, 12);
    geo.scale(1.0, 1.05, 1.0);
    const leg = new THREE.Mesh(geo, bodyMat);
    leg.position.set(sign * 0.25, 0.15, 0.06);
    leg.castShadow = true;
    return leg;
  }
  lightGroup.add(makeLeg(-1), makeLeg(1));

  const sparkles = [];
  const sparkleMat = new THREE.MeshStandardMaterial({ color: 0xfff2b0, emissive: 0xffdd66, emissiveIntensity: 1.2, transparent: true, opacity: 0.9 });
  for (let i = 0; i < 16; i++) {
    const s = 0.02 + Math.random() * 0.035;
    const geo = new THREE.OctahedronGeometry(s, 0);
    const m = new THREE.Mesh(geo, sparkleMat.clone());
    const angle = Math.random() * Math.PI * 2;
    const radius = 0.4 + Math.random() * 1.0;
    m.userData = { baseX: Math.cos(angle) * radius, baseZ: Math.sin(angle) * radius, speed: 0.18 + Math.random() * 0.22, phase: Math.random() * Math.PI * 2, freq: 0.6 + Math.random() * 0.6, startY: Math.random() * 2.0 };
    m.position.set(m.userData.baseX, m.userData.startY, m.userData.baseZ);
    sparkles.push(m);
    root.add(m);
  }

  let blinkTimer = 2.0, blinkPhase = 0;

  return {
    cameraPos: [0, 1.5, 4.6],
    cameraTarget: [0, 1.1, 0],
    update(t, dt) {
      const bob = Math.sin(t * 1.1) * 0.04;
      lightGroup.position.y = bob;
      const squash = Math.sin(t * 1.1) * 0.025;
      lightGroup.scale.set(1 - squash * 0.4, 1 + squash, 1 - squash * 0.4);
      haloGroup.rotation.y = t * 0.6;
      headGroup.rotation.y = Math.sin(t * 0.5) * 0.08;
      headGroup.rotation.z = Math.sin(t * 0.65 + 0.3) * 0.03;
      const flap = Math.sin(t * 1.8) * 0.18;
      leftWing.rotation.z = 0.1 + flap;
      rightWing.rotation.z = -0.1 - flap;

      blinkTimer -= dt;
      if (blinkTimer <= 0) {
        blinkPhase += dt * 9;
        const s = Math.max(0.06, Math.abs(Math.cos(blinkPhase * Math.PI)));
        leftEyeLid.scale.y = s; rightEyeLid.scale.y = s;
        if (blinkPhase >= 1) {
          blinkPhase = 0; leftEyeLid.scale.y = 1; rightEyeLid.scale.y = 1;
          blinkTimer = 2.5 + Math.random() * 2.5;
        }
      }

      for (const m of sparkles) {
        const u = m.userData;
        let y = m.position.y + u.speed * dt;
        if (y > 2.2) y = 0.0;
        m.position.y = y;
        m.position.x = u.baseX + Math.sin(t * u.freq + u.phase) * 0.1;
        m.position.z = u.baseZ + Math.cos(t * u.freq + u.phase) * 0.1;
        m.rotation.x += dt * 1.2;
        m.rotation.y += dt * 0.9;
        const life = y / 2.2;
        m.material.opacity = 0.85 * (1.0 - Math.abs(life - 0.5) * 1.2);
      }
    },
    dispose() { disposeGroup(root); scene.remove(root); },
  };
}

// ============================================================
// 008 ノクス (Nox) — output_contrib/DELL/element_poc/nox.html より移植
// ============================================================
function buildNox(scene) {
  const root = new THREE.Group();
  scene.add(root);

  const hemi = new THREE.HemisphereLight(0x4a3a6a, 0x0a0510, 0.9);
  root.add(hemi);
  const key = new THREE.DirectionalLight(0xc9a8ff, 1.4);
  key.position.set(3, 5, 4);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.near = 1; key.shadow.camera.far = 15;
  key.shadow.camera.left = -3; key.shadow.camera.right = 3;
  key.shadow.camera.top = 3; key.shadow.camera.bottom = -3;
  root.add(key);
  const fill = new THREE.DirectionalLight(0x5a3a8a, 0.6);
  fill.position.set(-4, 2, -2);
  root.add(fill);
  const rim = new THREE.PointLight(0xb060ff, 1.8, 10);
  rim.position.set(0, 2.4, -3);
  root.add(rim);

  const groundGeo = new THREE.CircleGeometry(3.2, 48);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1028, roughness: 0.8, metalness: 0.0, transparent: true, opacity: 0.6 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  root.add(ground);

  function makeShadowGeometry(radius, detail, roughAmount) {
    const geo = new THREE.IcosahedronGeometry(radius, detail);
    const pos = geo.attributes.position;
    const v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      const n = v.clone().normalize();
      const offset = ((Math.sin(i * 12.9898) * 43758.5453) % 1) * roughAmount;
      v.addScaledVector(n, offset);
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    geo.computeVertexNormals();
    return geo;
  }

  const noxGroup = new THREE.Group();
  root.add(noxGroup);

  const shadowMat = new THREE.MeshStandardMaterial({ color: 0x1c1526, roughness: 0.55, metalness: 0.1, flatShading: true });
  const shadowMatLight = new THREE.MeshStandardMaterial({ color: 0x2e2140, roughness: 0.5, metalness: 0.15, flatShading: true });
  const purpleGlowMat = new THREE.MeshStandardMaterial({ color: 0x8a4fd8, emissive: 0x6a2fc0, emissiveIntensity: 0.6, roughness: 0.4 });

  const bodyGeo = makeShadowGeometry(0.58, 1, 0.10);
  const bodyMesh = new THREE.Mesh(bodyGeo, shadowMat);
  bodyMesh.scale.set(1.0, 1.15, 1.0);
  bodyMesh.position.y = 0.70;
  bodyMesh.castShadow = true; bodyMesh.receiveShadow = true;
  noxGroup.add(bodyMesh);

  const headGroup = new THREE.Group();
  headGroup.position.set(0, 1.28, 0.0);
  noxGroup.add(headGroup);
  const headGeo = makeShadowGeometry(0.40, 1, 0.06);
  const headMesh = new THREE.Mesh(headGeo, shadowMat);
  headMesh.castShadow = true; headMesh.receiveShadow = true;
  headGroup.add(headMesh);

  const spikeTips = [];
  function makeSpike(x, y, z, h, r, rx, ry, rz) {
    const geo = new THREE.ConeGeometry(r, h, 6);
    const m = new THREE.Mesh(geo, Math.random() > 0.4 ? shadowMat : shadowMatLight);
    m.position.set(x, y, z);
    m.rotation.set(rx, ry, rz);
    m.castShadow = true;
    headGroup.add(m);
    spikeTips.push({ mesh: m, phase: Math.random() * Math.PI * 2, freq: 1.4 + Math.random() * 1.0 });
  }
  makeSpike(0, 0.55, -0.05, 0.5, 0.15, 0.05, 0, 0);
  makeSpike(-0.18, 0.44, -0.10, 0.42, 0.13, 0.1, 0.2, -0.4);
  makeSpike(0.20, 0.42, -0.08, 0.40, 0.13, 0.1, -0.2, 0.4);
  makeSpike(-0.32, 0.28, -0.15, 0.30, 0.11, 0.15, 0.5, -0.7);
  makeSpike(0.33, 0.26, -0.15, 0.28, 0.11, 0.15, -0.5, 0.7);

  function makeEye(x) {
    const geo = new THREE.OctahedronGeometry(0.09, 0);
    const m = new THREE.Mesh(geo, purpleGlowMat);
    m.position.set(x, 0.0, 0.36);
    m.scale.set(0.7, 1.3, 0.5);
    return m;
  }
  const leftEyeGlow = makeEye(-0.16);
  const rightEyeGlow = makeEye(0.16);
  headGroup.add(leftEyeGlow, rightEyeGlow);

  const spiralMat = new THREE.MeshStandardMaterial({ color: 0x9a5fe0, emissive: 0x7a3fc8, emissiveIntensity: 0.7, roughness: 0.3 });
  const spiral = new THREE.Mesh(new THREE.TorusGeometry(0.10, 0.02, 8, 20, Math.PI * 1.7), spiralMat);
  spiral.position.set(0, 0.60, 0.52);
  noxGroup.add(spiral);
  const spiralCore = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 8), spiralMat);
  spiralCore.position.set(0, 0.60, 0.52);
  noxGroup.add(spiralCore);

  function makeArm(sign) {
    const grp = new THREE.Group();
    const upperGeo = makeShadowGeometry(0.14, 0, 0.02);
    const upper = new THREE.Mesh(upperGeo, shadowMat);
    upper.scale.set(1.0, 1.6, 1.0);
    upper.castShadow = true;
    grp.add(upper);
    const flameGeo = new THREE.ConeGeometry(0.09, 0.24, 6);
    const flame = new THREE.Mesh(flameGeo, purpleGlowMat);
    flame.position.y = -0.30;
    flame.rotation.x = Math.PI;
    grp.add(flame);
    grp.userData.flame = flame;
    grp.position.set(sign * 0.56, 0.62, 0.05);
    grp.rotation.z = sign * 0.26;
    return grp;
  }
  const armL = makeArm(-1), armR = makeArm(1);
  noxGroup.add(armL, armR);
  const handFlames = [armL.userData.flame, armR.userData.flame];

  const hemGeo = new THREE.ConeGeometry(0.42, 0.5, 8, 1, true);
  const hemMesh = new THREE.Mesh(hemGeo, shadowMat);
  hemMesh.position.y = 0.12;
  hemMesh.rotation.x = Math.PI;
  hemMesh.castShadow = true;
  noxGroup.add(hemMesh);

  const wisps = [];
  const wispMat = new THREE.MeshStandardMaterial({ color: 0x6a3fa0, emissive: 0x4a2a80, emissiveIntensity: 0.5, transparent: true, opacity: 0.4, depthWrite: false });
  for (let i = 0; i < 14; i++) {
    const s = 0.06 + Math.random() * 0.10;
    const geo = new THREE.SphereGeometry(s, 8, 8);
    const m = new THREE.Mesh(geo, wispMat.clone());
    const angle = Math.random() * Math.PI * 2;
    const radius = 0.4 + Math.random() * 0.9;
    m.userData = { baseX: Math.cos(angle) * radius, baseZ: Math.sin(angle) * radius, speed: 0.10 + Math.random() * 0.16, phase: Math.random() * Math.PI * 2, freq: 0.35 + Math.random() * 0.4, startY: Math.random() * 1.6 };
    m.position.set(m.userData.baseX, m.userData.startY, m.userData.baseZ);
    wisps.push(m);
    root.add(m);
  }

  return {
    cameraPos: [0, 1.5, 4.6],
    cameraTarget: [0, 1.0, 0],
    update(t, dt) {
      const squash = Math.sin(t * 0.9) * 0.03;
      noxGroup.scale.set(1 - squash * 0.4, 1 + squash, 1 - squash * 0.4);
      noxGroup.position.y = Math.sin(t * 0.9) * 0.02;
      headGroup.rotation.y = Math.sin(t * 0.45) * 0.10;
      headGroup.rotation.x = Math.sin(t * 0.6 + 0.4) * 0.02;

      for (const s of spikeTips) {
        const flick = Math.sin(t * s.freq + s.phase) * 0.08 + Math.sin(t * s.freq * 2.3 + s.phase) * 0.04;
        s.mesh.rotation.z = flick;
        s.mesh.scale.y = 1 + Math.sin(t * s.freq * 1.5 + s.phase) * 0.05;
      }

      const pulse = 0.5 + Math.sin(t * 2.2) * 0.35;
      leftEyeGlow.material.emissiveIntensity = 0.4 + pulse;
      rightEyeGlow.material.emissiveIntensity = 0.4 + pulse;

      for (const f of handFlames) {
        f.scale.y = 1 + Math.sin(t * 6.0 + f.position.x * 10) * 0.15;
        f.material.emissiveIntensity = 0.5 + Math.sin(t * 5.0) * 0.2;
      }

      for (const m of wisps) {
        const u = m.userData;
        let y = m.position.y + u.speed * dt;
        if (y > 1.8) y = 0.0;
        m.position.y = y;
        m.position.x = u.baseX + Math.sin(t * u.freq + u.phase) * 0.08;
        m.position.z = u.baseZ + Math.cos(t * u.freq + u.phase) * 0.08;
        const life = y / 1.8;
        m.material.opacity = 0.38 * (1.0 - Math.abs(life - 0.5) * 0.9);
      }
    },
    dispose() { disposeGroup(root); scene.remove(root); },
  };
}

// ============================================================
// 009 リーフ (Leaf) — output_contrib/DELL/element_poc/leaf.html より移植
// ============================================================
function buildLeaf(scene) {
  const root = new THREE.Group();
  scene.add(root);

  const hemi = new THREE.HemisphereLight(0xe8ffc8, 0x2a4a1a, 1.1);
  root.add(hemi);
  const key = new THREE.DirectionalLight(0xf0ffd0, 2.0);

  key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.near = 1; key.shadow.camera.far = 15;
  key.shadow.camera.left = -3; key.shadow.camera.right = 3;
  key.shadow.camera.top = 3; key.shadow.camera.bottom = -3;
  root.add(key);
  const fill = new THREE.DirectionalLight(0xa8d878, 0.6);
  fill.position.set(-4, 2, -2);
  root.add(fill);
  const rim = new THREE.PointLight(0xffb8d8, 1.0, 10);
  rim.position.set(0, 2.6, -3);
  root.add(rim);

  const groundGeo = new THREE.CircleGeometry(3.2, 48);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0xbfe08c, roughness: 0.9, metalness: 0.0, transparent: true, opacity: 0.6 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  root.add(ground);
  const groundLeafMat = new THREE.MeshStandardMaterial({ color: 0x6fae3f, roughness: 0.8, flatShading: true, side: THREE.DoubleSide });
  for (let i = 0; i < 8; i++) {
    const s = 0.06 + Math.random() * 0.06;
    const geo2 = new THREE.CircleGeometry(s, 6);
    const m = new THREE.Mesh(geo2, groundLeafMat);
    const angle = Math.random() * Math.PI * 2;
    const radius = 1.1 + Math.random() * 1.7;
    m.position.set(Math.cos(angle) * radius, 0.01, Math.sin(angle) * radius);
    m.rotation.x = -Math.PI / 2;
    m.rotation.z = Math.random() * Math.PI;
    m.receiveShadow = true;
    root.add(m);
  }

  const leafGroup = new THREE.Group();
  root.add(leafGroup);

  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x7fbf4f, roughness: 0.7, metalness: 0.0 });
  const bodyMatLight = new THREE.MeshStandardMaterial({ color: 0x9fd66f, roughness: 0.7 });

  const bodyGeo = new THREE.SphereGeometry(0.60, 24, 20);
  bodyGeo.scale(1.05, 0.95, 1.0);
  const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
  bodyMesh.position.y = 0.66;
  bodyMesh.castShadow = true; bodyMesh.receiveShadow = true;
  leafGroup.add(bodyMesh);

  const headGroup = new THREE.Group();
  headGroup.position.set(0, 1.28, 0.0);
  leafGroup.add(headGroup);
  const headGeo = new THREE.SphereGeometry(0.42, 22, 18);
  const headMesh = new THREE.Mesh(headGeo, bodyMat);
  headMesh.castShadow = true; headMesh.receiveShadow = true;
  headGroup.add(headMesh);

  const sproutGeo = new THREE.ConeGeometry(0.06, 0.30, 8);
  const sprout = new THREE.Mesh(sproutGeo, bodyMatLight);
  sprout.position.set(0.02, 0.44, -0.03);
  sprout.rotation.z = -0.2;
  sprout.rotation.x = 0.1;
  sprout.castShadow = true;
  headGroup.add(sprout);
  const sproutCurl = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.02, 8, 12, Math.PI * 1.3), bodyMatLight);
  sproutCurl.position.set(0.03, 0.60, -0.05);
  sproutCurl.rotation.x = Math.PI / 2.3;
  headGroup.add(sproutCurl);

  const leafEars = [];
  function makeLeafEar(sign) {
    const geo = new THREE.ConeGeometry(0.17, 0.34, 4);
    const m = new THREE.Mesh(geo, bodyMatLight);
    m.position.set(sign * 0.30, 0.16, -0.05);
    m.rotation.z = sign * 0.7;
    m.rotation.y = sign * 0.3;
    m.castShadow = true;
    headGroup.add(m);
    leafEars.push({ mesh: m, sign, phase: Math.random() * Math.PI * 2 });
  }
  makeLeafEar(-1);
  makeLeafEar(1);

  const flowerGroup = new THREE.Group();
  flowerGroup.position.set(0, 0.52, 0.10);
  headGroup.add(flowerGroup);
  const petals = [];
  const petalMat = new THREE.MeshStandardMaterial({ color: 0xf6a8c8, roughness: 0.5 });
  const petalCount = 5;
  for (let i = 0; i < petalCount; i++) {
    const ang = (i / petalCount) * Math.PI * 2;
    const petalGeo = new THREE.SphereGeometry(0.06, 10, 8);
    petalGeo.scale(1.0, 0.6, 0.5);
    const petal = new THREE.Mesh(petalGeo, petalMat);
    petal.position.set(Math.cos(ang) * 0.07, 0, Math.sin(ang) * 0.07);
    petal.lookAt(0, 0.02, 0);
    flowerGroup.add(petal);
    petals.push(petal);
  }
  const flowerCenter = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 10), new THREE.MeshStandardMaterial({ color: 0xffd94a, emissive: 0x8a6000, emissiveIntensity: 0.2 }));
  flowerGroup.add(flowerCenter);

  const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
  const eyePupilMat = new THREE.MeshStandardMaterial({ color: 0x2a1a0a, roughness: 0.3 });
  function makeEye(x) {
    const grp = new THREE.Group();
    const white = new THREE.Mesh(new THREE.SphereGeometry(0.115, 16, 16), eyeWhiteMat);
    grp.add(white);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.065, 12, 12), eyePupilMat);
    pupil.position.z = 0.085;
    grp.add(pupil);
    const highlight = new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    highlight.position.set(0.03, 0.04, 0.13);
    grp.add(highlight);
    grp.position.set(x, -0.02, 0.36);
    return grp;
  }
  const leftEyeLid = makeEye(-0.17);
  const rightEyeLid = makeEye(0.17);
  headGroup.add(leftEyeLid, rightEyeLid);

  function makeVineArm(sign) {
    const grp = new THREE.Group();
    const segCount = 3;
    let prevY = 0;
    for (let i = 0; i < segCount; i++) {
      const segGeo = new THREE.CylinderGeometry(0.05 - i * 0.01, 0.06 - i * 0.01, 0.16, 8);
      const seg = new THREE.Mesh(segGeo, bodyMat);
      seg.position.y = prevY - 0.08;
      seg.rotation.z = sign * (0.15 + i * 0.1);
      seg.castShadow = true;
      grp.add(seg);
      prevY -= 0.16;
    }
    grp.position.set(sign * 0.58, 0.64, 0.05);
    return grp;
  }
  leafGroup.add(makeVineArm(-1), makeVineArm(1));

  function makeLeg(sign) {
    const geo = new THREE.SphereGeometry(0.15, 14, 12);
    geo.scale(1.0, 1.0, 1.05);
    const leg = new THREE.Mesh(geo, bodyMat);
    leg.position.set(sign * 0.26, 0.15, 0.06);
    leg.castShadow = true;
    return leg;
  }
  leafGroup.add(makeLeg(-1), makeLeg(1));

  const emblemMat = new THREE.MeshStandardMaterial({ color: 0xdff0c8, roughness: 0.4 });
  const emblem = new THREE.Mesh(new THREE.CircleGeometry(0.10, 16), emblemMat);
  emblem.position.set(0, 0.64, 0.60);
  leafGroup.add(emblem);

  const pollen = [];
  const pollenMat = new THREE.MeshStandardMaterial({ color: 0xfff2a0, emissive: 0xe8c840, emissiveIntensity: 0.6, transparent: true, opacity: 0.75 });
  for (let i = 0; i < 14; i++) {
    const s = 0.02 + Math.random() * 0.03;
    const geo = new THREE.SphereGeometry(s, 8, 8);
    const m = new THREE.Mesh(geo, pollenMat.clone());
    const angle = Math.random() * Math.PI * 2;
    const radius = 0.4 + Math.random() * 1.0;
    m.userData = { baseX: Math.cos(angle) * radius, baseZ: Math.sin(angle) * radius, speed: 0.10 + Math.random() * 0.14, phase: Math.random() * Math.PI * 2, freq: 0.5 + Math.random() * 0.5, startY: Math.random() * 1.8 };
    m.position.set(m.userData.baseX, m.userData.startY, m.userData.baseZ);
    pollen.push(m);
    root.add(m);
  }

  let blinkTimer = 2.0, blinkPhase = 0;

  return {
    cameraPos: [0, 1.5, 4.6],
    cameraTarget: [0, 1.0, 0],
    update(t, dt) {
      const sway = Math.sin(t * 0.7) * 0.06;
      leafGroup.rotation.z = sway * 0.3;
      const squash = Math.sin(t * 1.0) * 0.025;
      leafGroup.scale.set(1 - squash * 0.4, 1 + squash, 1 - squash * 0.4);
      headGroup.rotation.y = Math.sin(t * 0.5) * 0.10;
      flowerGroup.rotation.y = t * 0.4;
      for (let i = 0; i < petals.length; i++) {
        petals[i].scale.setScalar(1 + Math.sin(t * 1.3 + i) * 0.06);
      }
      for (const e of leafEars) {
        e.mesh.rotation.x = Math.sin(t * 1.1 + e.phase) * 0.15 * e.sign;
      }

      blinkTimer -= dt;
      if (blinkTimer <= 0) {
        blinkPhase += dt * 9;
        const s = Math.max(0.06, Math.abs(Math.cos(blinkPhase * Math.PI)));
        leftEyeLid.scale.y = s; rightEyeLid.scale.y = s;
        if (blinkPhase >= 1) {
          blinkPhase = 0; leftEyeLid.scale.y = 1; rightEyeLid.scale.y = 1;
          blinkTimer = 2.7 + Math.random() * 2.4;
        }
      }

      for (const p of pollen) {
        const u = p.userData;
        let y = p.position.y + u.speed * dt;
        if (y > 2.0) y = 0.0;
        p.position.y = y;
        p.position.x = u.baseX + Math.sin(t * u.freq + u.phase) * 0.09;
        p.position.z = u.baseZ + Math.cos(t * u.freq + u.phase) * 0.09;
        const life = y / 2.0;
        p.material.opacity = 0.7 * (1.0 - Math.abs(life - 0.5) * 1.1);
      }
    },
    dispose() { disposeGroup(root); scene.remove(root); },
  };
}

// ============================================================
// 010 プラズマ (Plasma) — output_contrib/DELL/element_poc/plasma.html より移植
// ============================================================
function buildPlasma(scene) {
  const root = new THREE.Group();
  scene.add(root);

  const hemi = new THREE.HemisphereLight(0x5a3a9a, 0x0a0518, 1.0);
  root.add(hemi);
  const key = new THREE.DirectionalLight(0xc9a0ff, 1.6);
  key.position.set(3, 5, 4);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.near = 1; key.shadow.camera.far = 15;
  key.shadow.camera.left = -3; key.shadow.camera.right = 3;
  key.shadow.camera.top = 3; key.shadow.camera.bottom = -3;
  root.add(key);
  const fill = new THREE.DirectionalLight(0x4a2a8a, 0.6);
  fill.position.set(-4, 2, -2);
  root.add(fill);
  const rim = new THREE.PointLight(0xb060ff, 2.0, 10);
  rim.position.set(0, 2.6, -3);
  root.add(rim);

  const groundGeo = new THREE.CircleGeometry(3.2, 48);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e1430, roughness: 0.6, metalness: 0.1, transparent: true, opacity: 0.6 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  root.add(ground);

  const plasmaGroup = new THREE.Group();
  root.add(plasmaGroup);

  const darkMat = new THREE.MeshStandardMaterial({ color: 0x120c1e, roughness: 0.35, metalness: 0.3 });
  const whiteMat = new THREE.MeshStandardMaterial({ color: 0xf0e8ff, roughness: 0.4 });
  const purpleGlow = new THREE.MeshStandardMaterial({ color: 0x9a5fe0, emissive: 0x7a3fc8, emissiveIntensity: 0.7, roughness: 0.3, metalness: 0.4 });

  const robeGeo = new THREE.ConeGeometry(0.42, 0.85, 16, 1, true);
  const robeMesh = new THREE.Mesh(robeGeo, darkMat);
  robeMesh.position.y = 0.48;
  robeMesh.rotation.x = Math.PI;
  robeMesh.castShadow = true;
  plasmaGroup.add(robeMesh);
  const hemCap = new THREE.Mesh(new THREE.CircleGeometry(0.42, 16), darkMat);
  hemCap.position.y = 0.06;
  hemCap.rotation.x = -Math.PI / 2;
  plasmaGroup.add(hemCap);

  const headGroup = new THREE.Group();
  headGroup.position.set(0, 1.18, 0.0);
  plasmaGroup.add(headGroup);
  const headGeo = new THREE.SphereGeometry(0.40, 22, 18);
  const headMesh = new THREE.Mesh(headGeo, whiteMat);
  headMesh.scale.set(1.0, 0.92, 0.95);
  headMesh.castShadow = true; headMesh.receiveShadow = true;
  headGroup.add(headMesh);

  const faceGeo = new THREE.SphereGeometry(0.30, 20, 16);
  const faceMesh = new THREE.Mesh(faceGeo, darkMat);
  faceMesh.scale.set(0.95, 1.0, 0.7);
  faceMesh.position.set(0, -0.02, 0.06);
  headGroup.add(faceMesh);

  const crownGroup = new THREE.Group();
  crownGroup.position.set(0, 0.44, 0.0);
  headGroup.add(crownGroup);
  function makeHorn(sign) {
    const geo = new THREE.TorusGeometry(0.14, 0.025, 8, 20, Math.PI * 1.1);
    const m = new THREE.Mesh(geo, whiteMat);
    m.position.set(sign * 0.10, 0, 0);
    m.rotation.z = sign * 0.5;
    m.rotation.y = Math.PI / 2;
    m.castShadow = true;
    crownGroup.add(m);
  }
  makeHorn(-1);
  makeHorn(1);
  const crownGem = new THREE.Mesh(new THREE.OctahedronGeometry(0.06, 0), purpleGlow);
  crownGem.position.set(0, 0.20, 0.02);
  crownGroup.add(crownGem);

  const eyeMatL = new THREE.MeshStandardMaterial({ color: 0x6fe0e0, emissive: 0x2fa0a0, emissiveIntensity: 0.9 });
  const eyeMatR = new THREE.MeshStandardMaterial({ color: 0xff9fd0, emissive: 0xc04f90, emissiveIntensity: 0.9 });
  const leftEyeGlow = new THREE.Mesh(new THREE.SphereGeometry(0.075, 14, 14), eyeMatL);
  leftEyeGlow.position.set(-0.13, -0.02, 0.32);
  const rightEyeGlow = new THREE.Mesh(new THREE.SphereGeometry(0.075, 14, 14), eyeMatR);
  rightEyeGlow.position.set(0.13, -0.02, 0.32);
  headGroup.add(leftEyeGlow, rightEyeGlow);

  const faceRings = [];
  const ringMat = new THREE.MeshStandardMaterial({ color: 0x9a6fe0, emissive: 0x6a3fc0, emissiveIntensity: 0.5 });
  for (let i = 0; i < 3; i++) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.24 + i * 0.02, 0.006, 6, 24, Math.PI * 0.9), ringMat);
    ring.position.set(0, -0.02, 0.02);
    ring.rotation.x = 0.2;
    ring.rotation.z = -Math.PI * 0.45 + i * 0.05;
    headGroup.add(ring);
    faceRings.push(ring);
  }

  const emblemRing = new THREE.Mesh(new THREE.TorusGeometry(0.09, 0.018, 8, 24), whiteMat);
  emblemRing.position.set(0, 0.62, 0.36);
  plasmaGroup.add(emblemRing);
  const emblemCore = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 12), purpleGlow);
  emblemCore.position.set(0, 0.62, 0.36);
  plasmaGroup.add(emblemCore);

  function makeSleeve(sign) {
    const geo = new THREE.ConeGeometry(0.12, 0.30, 10, 1, true);
    const m = new THREE.Mesh(geo, darkMat);
    m.rotation.x = Math.PI;
    m.position.set(sign * 0.42, 0.58, 0.02);
    m.rotation.z = sign * 0.3;
    m.castShadow = true;
    plasmaGroup.add(m);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 10), whiteMat);
    hand.position.set(sign * 0.50, 0.42, 0.02);
    plasmaGroup.add(hand);
  }
  makeSleeve(-1);
  makeSleeve(1);

  const orbs = [];
  const orbColors = [0x9a5fe0, 0x6fe0e0, 0xff9fd0];
  for (let i = 0; i < 3; i++) {
    const mat = new THREE.MeshStandardMaterial({ color: orbColors[i], emissive: orbColors[i], emissiveIntensity: 0.8, roughness: 0.25, metalness: 0.3 });
    const orb = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 16), mat);
    orb.userData = { radius: 0.62, baseAngle: (i / 3) * Math.PI * 2, speed: 0.7 + i * 0.15, yFreq: 1.1 + i * 0.3, yPhase: i * 2.1, yBase: 0.55 + i * 0.12 };
    orb.castShadow = true;
    orbs.push(orb);
    plasmaGroup.add(orb);
  }

  return {
    cameraPos: [0, 1.5, 4.6],
    cameraTarget: [0, 1.1, 0],
    update(t, dt) {
      const levitate = Math.sin(t * 1.3) * 0.06;
      plasmaGroup.position.y = 0.06 + levitate;
      plasmaGroup.rotation.y = Math.sin(t * 0.35) * 0.12;
      const pulse = 1 + Math.sin(t * 1.6) * 0.02;
      headGroup.scale.setScalar(pulse);
      crownGroup.rotation.y = t * 0.5;

      const eyePulse = 0.7 + Math.sin(t * 2.4) * 0.3;
      leftEyeGlow.material.emissiveIntensity = eyePulse;
      rightEyeGlow.material.emissiveIntensity = eyePulse * 0.9 + Math.sin(t * 3.1 + 1) * 0.2;

      for (let i = 0; i < faceRings.length; i++) {
        faceRings[i].rotation.z += dt * (0.3 + i * 0.15);
      }

      for (const orb of orbs) {
        const u = orb.userData;
        const ang = u.baseAngle + t * u.speed;
        orb.position.set(Math.cos(ang) * u.radius, u.yBase + Math.sin(t * u.yFreq + u.yPhase) * 0.12, Math.sin(ang) * u.radius);
        orb.rotation.y += dt * 2.0;
      }
    },
    dispose() { disposeGroup(root); scene.remove(root); },
  };
}

</script>
